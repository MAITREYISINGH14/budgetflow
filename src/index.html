<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BudgetFlow</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6fa" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block"
      rel="stylesheet"
    />
    <script>
      // Apply the saved light/dark theme before Angular starts, so the page never flashes the wrong one.
      (function () {
        var theme;
        try {
          theme = JSON.parse(localStorage.getItem('budgetflow.settings.v1') || '{}').theme;
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <bf-root></bf-root>
  </body>
</html>
