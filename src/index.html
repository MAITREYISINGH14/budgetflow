<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BudgetFlow</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="BudgetFlow: track income and expenses, set monthly budgets and see where your money goes."
    />
    <meta name="theme-color" content="#f3f4f8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

      Only the icons the app uses are downloaded (icon_names, alphabetical).
      When you use a new icon anywhere in the app, add its name to this list.

      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=add,arrow_downward,arrow_upward,check_circle,chevron_left,chevron_right,close,cloud_off,dark_mode,delete,do_not_disturb_on,donut_small,download,east,edit,error,filter_list,inbox,light_mode,monitoring,north,north_east,receipt_long,savings,search,south,south_west,space_dashboard,trending_down,tune,warning&display=block"

    />

    <bf-root></bf-root>
    <noscript>BudgetFlow needs JavaScript to run. Please enable it in your browser settings.</noscript>
  </body>
