<a class="skip-link" href="#main">Skip to content</a>

<header class="appbar">
  <a class="brand" routerLink="/dashboard" aria-label="BudgetFlow home">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M6 19V11M12 19V5M18 19v-5" /></svg>
    </span>
    <span class="brand__name">budget<strong>flow</strong></span>
  </a>

  <nav class="top-nav" aria-label="Main">
    @for (item of nav; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ item.label }}</a>
    }
  </nav>

  <div class="appbar__actions">
    <button
      type="button"
      class="round-btn"
      (click)="toggleTheme()"
      [attr.aria-label]="settings.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <span class="material-symbols-outlined" aria-hidden="true">{{
        settings.isDark() ? 'light_mode' : 'dark_mode'
      }}</span>
    </button>
  </div>
</header>

<main id="main" class="content" tabindex="-1">
  @if (page().heading && !page().hideHeading) {
    <h1 class="page-title">{{ page().heading }}</h1>
  }
  @if (configured) {
    <router-outlet />
  }
</main>

<nav class="bottom-nav" aria-label="Main">
  @for (item of nav; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      [attr.aria-label]="item.label"
    >
      <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
    </a>
  }
</nav>

<bf-toast-host />
