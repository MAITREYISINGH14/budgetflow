<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard" aria-label="BudgetFlow home">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" />
        <path d="M10 23v-8M16 23V9M22 23v-6" />
      </svg>
      <span class="brand__name">BudgetFlow</span>
    </a>

    <nav aria-label="Main">
      <ul class="side-nav">
        @for (item of nav; track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="is-active" ariaCurrentWhenActive="page">
              <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <button
      type="button"
      class="theme-toggle"
      role="switch"
      [attr.aria-checked]="settings.isDark()"
      (click)="toggleTheme()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">{{
        settings.isDark() ? 'dark_mode' : 'light_mode'
      }}</span>
      <span class="theme-toggle__label">Dark mode</span>
      <span class="theme-toggle__switch" aria-hidden="true"><span class="theme-toggle__knob"></span></span>
    </button>
  </aside>

  <div class="main-column">
    <header class="topbar">
      <a class="brand brand--compact" routerLink="/dashboard" aria-label="BudgetFlow home">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" />
          <path d="M10 23v-8M16 23V9M22 23v-6" />
        </svg>
      </a>
      <h1 class="topbar__title">{{ heading() }}</h1>
      <button
        type="button"
        class="icon-btn topbar__theme"
        (click)="toggleTheme()"
        [attr.aria-label]="settings.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <span class="material-symbols-outlined" aria-hidden="true">{{
          settings.isDark() ? 'light_mode' : 'dark_mode'
        }}</span>
      </button>
    </header>

    <main id="main" class="content" tabindex="-1">
      @if (configured) {
        <router-outlet />
      }
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Main">
    @for (item of nav; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="is-active" ariaCurrentWhenActive="page">
        <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
        <span class="bottom-nav__label">{{ item.label }}</span>
      </a>
    }
  </nav>
</div>

<bf-toast-host />
